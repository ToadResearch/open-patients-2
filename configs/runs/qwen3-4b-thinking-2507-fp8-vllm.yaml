run:
  dataset: ncbi/Open-Patients
  split: train
  out_dir: ./open_patients_qwen3_4b_thinking_2507_fp8
  resume: true
  samples: 3
  shard_size: 50000
  schema: configs/schemas/schema.json
  usmle_mapping: configs/usmle_mapping.json

model:
  name: Qwen/Qwen3-4B-Thinking-2507-FP8
  prompt_mode: chat

api:
  timeout_s: 180.0
  max_retries: 1
  retry_backoff_initial_s: 1.0
  retry_backoff_max_s: 10.0
  outage_abort_after_s: 300.0
  endpoints:
    - name: qwen3_4b_thinking_fp8
      base_url: http://127.0.0.1:8210/v1
      model: Qwen/Qwen3-4B-Thinking-2507-FP8
      api_key_env: OPENAI_API_KEY
      concurrency: 2
      structured_mode: json_schema
      extra_body:
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repetition_penalty: 1.0
      serve:
        host: 127.0.0.1
        port: 8210
        cuda_visible_devices: "0"
        tensor_parallel_size: 1
        dtype: auto
        max_model_len: 8192
        gpu_memory_utilization: 0.9
        reasoning_parser: qwen3
        enable_chunked_prefill: true
        enable_prefix_caching: true
        max_num_batched_tokens: 4096
        max_num_seqs: 16
        max_parallel_loading_workers: 2

sampling:
  temperature: 0.6
  top_p: 0.95
  max_new_tokens: 2048
  seed: 0
  structured_output: true
