run:
  dataset: ncbi/Open-Patients
  split: train
  out_dir: ./open_patients_baichuan_m3
  processed_ids: processed_ids.txt
  schema: configs/schemas/schema.json
  usmle_mapping: configs/usmle_mapping.json
  samples: -1
  shard_size: 50000
  resume: true
  num_shards: 1
  shard_idx: 0

model:
  name: baichuan-inc/Baichuan-M3-235B-GPTQ-INT4
  prompt_mode: chat

api:
  timeout_s: 120.0
  max_retries: 4
  retry_backoff_initial_s: 1.0
  retry_backoff_max_s: 30.0
  outage_abort_after_s: 900.0
  endpoints:
    - name: baichuanm3
      base_url: http://127.0.0.1:8003/v1
      model: baichuan-inc/Baichuan-M3-235B-GPTQ-INT4
      api_key_env: OPENAI_API_KEY
      concurrency: 32
      structured_mode: json_schema
      extra_body: {}
      serve:
        host: 127.0.0.1
        port: 8003
        cuda_visible_devices: "0,1,2,3,4,5,6,7"
        tensor_parallel_size: 4
        data_parallel_size: 2
        enable_expert_parallel: true
        max_model_len: 8192
        gpu_memory_utilization: 0.92
        max_parallel_loading_workers: 2
        enable_chunked_prefill: true
        max_num_batched_tokens: 8192
        max_num_seqs: 128
        enable_prefix_caching: true
        kv_cache_dtype: fp8
        calculate_kv_scales: false

sampling:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 700
  seed: 0
  structured_output: true
