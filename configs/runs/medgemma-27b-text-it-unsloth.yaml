run:
  dataset: ncbi/Open-Patients
  split: train
  out_dir: ./open_patients_medgemma27b_unsloth
  resume: true
  samples: -1
  shard_size: 50000
  schema: configs/schemas/schema.json
  usmle_mapping: configs/usmle_mapping.json

model:
  name: unsloth/medgemma-27b-text-it
  prompt_mode: chat

api:
  timeout_s: 120.0
  max_retries: 4
  retry_backoff_initial_s: 1.0
  retry_backoff_max_s: 30.0
  outage_abort_after_s: 900.0
  endpoints:
    - name: medgemma27b
      base_url: http://127.0.0.1:8000/v1
      model: unsloth/medgemma-27b-text-it
      api_key_env: OPENAI_API_KEY
      concurrency: 128
      structured_mode: json_schema
      extra_body: {}
      serve:
        host: 127.0.0.1
        port: 8000
        cuda_visible_devices: "0"
        tensor_parallel_size: 1
        dtype: auto
        max_model_len: 8192
        gpu_memory_utilization: 0.92
        enable_chunked_prefill: true
        enable_prefix_caching: true
        kv_cache_dtype: fp8
        calculate_kv_scales: false
        max_num_batched_tokens: 8192
        max_num_seqs: 128
        max_parallel_loading_workers: 2

sampling:
  temperature: 0.0
  top_p: 0.95
  max_new_tokens: 8192
  seed: 0
  structured_output: true

parallel:
  replicas: 8
