run:
  # Backwards-compatible alias for configs/runs/medgemma-1.5-4b-it-unsloth.yaml
  dataset: ncbi/Open-Patients
  split: train
  out_dir: ./open_patients_medgemma1_5_4b_unsloth
  resume: true
  # Tuned for a single H100 80GB (see scripts/sweep_single_h100.py results).
  batch_size: 256
  max_notes: 0
  shard_size: 50000
  schema: configs/schemas/schema.json
  usmle_mapping: configs/usmle_mapping.json

model:
  # Use the newer MedGemma 1.5 4B Instruct checkpoint (Unsloth).
  name: unsloth/medgemma-1.5-4b-it
  prompt_mode: chat

vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  enable_expert_parallel: false
  dtype: auto
  max_model_len: 8192
  gpu_memory_utilization: 0.92
  # Note: vLLM warns that this model may not officially support disabling chunked prefill.
  # Keep it enabled for stability; if you want to chase max throughput, try disabling and re-sweeping.
  enable_chunked_prefill: true
  enable_prefix_caching: true
  kv_cache_dtype: fp8
  calculate_kv_scales: false
  quantization: null
  max_num_batched_tokens: 32768
  max_num_seqs: 256
  max_parallel_loading_workers: 2

sampling:
  temperature: 0.0
  top_p: 0.95
  # Some notes can produce long JSON (many list items); keep this high to avoid truncation.
  max_new_tokens: 8192
  seed: 0
  structured_output: true

prompt:
  disable_thinking: false
