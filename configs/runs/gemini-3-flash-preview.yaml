run:
  dataset: ncbi/Open-Patients
  split: train
  out_dir: ./gemini_3_flash_preview
  resume: true
  # Set samples to a positive integer for quick testing.
  # Use -1 (or omit this key) to run the full dataset.
  samples: 32
  shard_size: 50000
  schema: configs/schemas/schema.json
  usmle_mapping: configs/usmle_mapping.json

model:
  name: gemini-3-flash-preview
  prompt_mode: chat

api:
  timeout_s: 120.0
  max_retries: 4
  retry_backoff_initial_s: 1.0
  retry_backoff_max_s: 30.0
  outage_abort_after_s: 900.0
  endpoints:
    - name: gemini-3-flash-preview
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      model: gemini-3-flash-preview
      api_key_env: GEMINI_API_KEY
      concurrency: 8
      structured_mode: json_object
      extra_body:
        reasoning_effort: minimal
      serve: {}

sampling:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 4096
  seed: 0
  structured_output: true
