run:
  dataset: ncbi/Open-Patients
  split: train
  out_dir: ./open_patients_openrouter_qwen3_235b_a22b_thinking_2507
  resume: true
  # Small default sample count for reasoning-smoke tests.
  # Use -1 (or omit this key) to run the full dataset.
  samples: 8
  shard_size: 50000
  schema: configs/schemas/schema.json
  usmle_mapping: configs/usmle_mapping.json

model:
  name: qwen/qwen3-235b-a22b-thinking-2507
  prompt_mode: chat

api:
  timeout_s: 120.0
  max_retries: 4
  retry_backoff_initial_s: 1.0
  retry_backoff_max_s: 30.0
  outage_abort_after_s: 900.0
  endpoints:
    - name: openrouter-qwen3-thinking
      base_url: https://openrouter.ai/api/v1
      model: qwen/qwen3-235b-a22b-thinking-2507
      api_key_env: OPENROUTER_API_KEY
      concurrency: 2
      structured_mode: none
      extra_body: {}
      serve: {}

sampling:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 2048
  seed: 0
  structured_output: false
