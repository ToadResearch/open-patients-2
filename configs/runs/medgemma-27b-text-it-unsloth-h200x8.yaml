run:
  dataset: ncbi/Open-Patients
  split: train
  out_dir: ./open_patients_medgemma27b_text_it_h200x8
  resume: true
  samples: -1
  shard_size: 50000
  schema: configs/schemas/schema.json
  usmle_mapping: configs/usmle_mapping.json

model:
  name: unsloth/medgemma-27b-text-it
  prompt_mode: chat

api:
  timeout_s: 180.0
  max_retries: 4
  retry_backoff_initial_s: 1.0
  retry_backoff_max_s: 30.0
  outage_abort_after_s: 900.0
  endpoints:
    - name: medgemma-g0
      base_url: http://127.0.0.1:8100/v1
      model: unsloth/medgemma-27b-text-it
      api_key_env: OPENAI_API_KEY
      concurrency: 16
      structured_mode: json_schema
      extra_body:
        top_k: 64
      serve:
        host: 127.0.0.1
        port: 8100
        cuda_visible_devices: "0"
        tensor_parallel_size: 1
        dtype: bfloat16
        max_model_len: 32768
        gpu_memory_utilization: 0.92
        attention_backend: FLASH_ATTN
        enable_chunked_prefill: true
        enable_prefix_caching: true
        kv_cache_dtype: fp8
        calculate_kv_scales: false
        max_num_batched_tokens: 16384
        max_num_seqs: 64
    - name: medgemma-g1
      base_url: http://127.0.0.1:8101/v1
      model: unsloth/medgemma-27b-text-it
