run:
  dataset: ncbi/Open-Patients
  split: train
  out_dir: ./open_patients_qwen3_5_397b_a17b_fp8_h200x8
  resume: true
  samples: -1
  shard_size: 50000
  schema: configs/schemas/schema.json
  usmle_mapping: configs/usmle_mapping.json

model:
  name: Qwen/Qwen3.5-397B-A17B-FP8
  prompt_mode: chat

api:
  timeout_s: 300.0
  max_retries: 4
  retry_backoff_initial_s: 1.0
  retry_backoff_max_s: 30.0
  outage_abort_after_s: 1200.0
  endpoints:
    - name: qwen3_5_397b
      base_url: http://127.0.0.1:8200/v1
      model: Qwen/Qwen3.5-397B-A17B-FP8
      api_key_env: OPENAI_API_KEY
      concurrency: 24
      structured_mode: json_schema
      extra_body:
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repetition_penalty: 1.0
      serve:
        host: 127.0.0.1
        port: 8200
        cuda_visible_devices: "0,1,2,3,4,5,6,7"
        tensor_parallel_size: 8
        dtype: auto
        max_model_len: 131072
        gpu_memory_utilization: 0.9
        attention_backend: FLASH_ATTN
        enable_reasoning: true
        reasoning_parser: qwen3
        language_model_only: true
        enable_chunked_prefill: true
        enable_prefix_caching: true
        kv_cache_dtype: fp8
        calculate_kv_scales: true
        max_num_batched_tokens: 16384
        max_num_seqs: 64
        max_parallel_loading_workers: 4

# HF model page recommendation: temperature=0.6, top_p=0.95, top_k=20, min_p=0.
sampling:
  temperature: 0.6
  top_p: 0.95
  max_new_tokens: 32768
  seed: 0
  structured_output: true

parallel:
  replicas: 1
